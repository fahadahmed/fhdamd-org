name: Deploy jamaal-web functions

# Deploys the Cloud Functions and the Firestore rules and indexes to the jamaal-web
# project. The site itself deploys from ci-jamaal-web.yml (Hosting only).

on:
  push:
    branches:
      - main
    paths:
      - apps/jamaal-web/functions/**
      - apps/jamaal-web/firestore.rules
      - apps/jamaal-web/firestore.indexes.json
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once; let a running one finish.
concurrency:
  group: deploy-jamaal-functions
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy functions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      # Pinned below 22.23.0: that Node security release broke node-fetch's
      # handling of keep-alive socket closures, which breaks firebase-tools'
      # deploy calls (ERR_STREAM_PREMATURE_CLOSE) — see #201.
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Test and compile the functions
        run: |
          pnpm --filter jamaal-web-functions test
          pnpm --filter jamaal-web-functions build

      - name: Install the Firebase CLI
        run: pnpm add -g firebase-tools --ignore-scripts

      # The service account needs, on jamaal-web: Cloud Functions Admin, Service
      # Account User, Firebase Rules Admin, Cloud Datastore Index Admin,
      # Artifact Registry Writer, Secret Manager Viewer and Cloud Build Editor.
      - name: Deploy functions, rules and indexes
        working-directory: apps/jamaal-web
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JAMAAL_WEB }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/jamaal-web-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/jamaal-web-sa.json"
          firebase deploy --only functions,firestore --project jamaal-web --non-interactive
          rm -f "$RUNNER_TEMP/jamaal-web-sa.json"
