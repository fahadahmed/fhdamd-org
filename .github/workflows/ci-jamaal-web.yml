name: CI jamaal-web

on:
  push:
    branches:
      - main
    paths:
      - apps/jamaal-web/**
  pull_request:
    branches:
      - main
    paths:
      - apps/jamaal-web/**
  # Run by the rebuildOnConfigChange function when Remote Config is published, so a
  # stage flip rebuilds the static site. Also usable by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm --filter jamaal-web lint

      # Catches type errors in .astro, .ts and test files that eslint and the
      # build both let through.
      - name: Type check
        run: pnpm --filter jamaal-web exec astro check

      - name: Run tests with coverage
        run: pnpm --filter jamaal-web test:coverage

      - name: Test and compile the Cloud Functions
        run: |
          pnpm --filter jamaal-web-functions test
          pnpm --filter jamaal-web-functions build

      - name: SonarCloud scan
        uses: SonarSource/sonarcloud-github-action@383f7e52eae3ab0510c3cb0e7d9d150bbaeab838 # v3
        with:
          projectBaseDir: apps/jamaal-web
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  preview:
    name: Build and deploy jamaal-web (preview channel)
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      # Pinned below 22.23.0: that Node security release broke node-fetch's
      # handling of keep-alive socket closures, which breaks firebase-tools'
      # Firebase Hosting deploy calls (ERR_STREAM_PREMATURE_CLOSE) — see #201.
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # The stage (waitlist, testflight, launched) lives in Remote Config. A
      # preview build falls back to waitlist if it cannot be read.
      - name: Resolve site stage
        run: node apps/jamaal-web/scripts/stage.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT_JAMAAL_WEB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JAMAAL_WEB }}
          STAGE_READ_OPTIONAL: "true"

      - name: Build jamaal-web
        run: pnpm --filter jamaal-web build
        env:
          # Public GA4 measurement ID. Without it the site builds with no analytics and no cookie banner.
          PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.JAMAAL_FIREBASE_MEASUREMENT_ID }}

      # Each PR gets its own channel (pr<number>-<branch>) with a preview URL
      # posted as a PR comment. Channels expire after 7 days.
      - name: Deploy to Firebase Hosting (preview channel)
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JAMAAL_WEB }}
          projectId: jamaal-web
          expires: 7d
          entryPoint: apps/jamaal-web

  deploy:
    name: Build and deploy jamaal-web (live)
    needs: test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      # Pinned below 22.23.0, see the preview job and #201.
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # The stage (waitlist, testflight, launched) lives in Remote Config. A
      # live build fails if it cannot be read, so it never ships a stale stage.
      - name: Resolve site stage
        run: node apps/jamaal-web/scripts/stage.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT_JAMAAL_WEB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JAMAAL_WEB }}

      - name: Build jamaal-web
        run: pnpm --filter jamaal-web build
        env:
          # Public GA4 measurement ID. Without it the site builds with no analytics and no cookie banner.
          PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.JAMAAL_FIREBASE_MEASUREMENT_ID }}

      - name: Deploy to Firebase Hosting (live)
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JAMAAL_WEB }}
          projectId: jamaal-web
          channelId: live
          entryPoint: apps/jamaal-web
